<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #111827;
      display: flex;
      font-family: Arial, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    .message {
      background: #fff;
      border: 1px solid #dbe4f0;
      border-radius: 8px;
      max-width: 520px;
      padding: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="message">
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
  </main>
</body>
</html>
